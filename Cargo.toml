[package]
name = "wl"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "wl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
fuzzy-matcher = "0.3"
thiserror = "1"
dirs = "5"
chrono = "0.4"
sha2 = "0.10"

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
